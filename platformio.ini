[platformio]
default_envs = cyd2usb

[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/check_firmware.py
build_src_filter = +<*> -<net/SelfTest.cpp>
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.2.7
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D HTTPCLIENT_NOSECURE
    -D LV_KCONFIG_IGNORE
    -D WEBSERVER_MAX_URI_LEN=128
    -D WEBSERVER_MAX_QUERY_ARGS=8
    -D WEBSERVER_MAX_LINE_LEN=1024
    -D WEBSERVER_MAX_POST_ARG_LEN=1024
    -D WEBSERVER_MAX_HEADER_WAIT=1000
    -D WEBSERVER_MAX_LINE_WAIT=1000
    -Wall
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_SM_SC_ONLY=1
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0

[env:cyd2usb]
build_flags = ${env.build_flags}
    -D BADGE_ST7789=1

[env:cyd]
build_flags = ${env.build_flags}
    -D BADGE_ST7789=0
